#
# StarDict Package configuration file
# More info at http://keypirinha.com
#

[main]
# Word to type in Keypirinha, then Tab, then the query.
# Default: tr
#keyword = tr

# Maximum number of result rows. Default: 30
#max_rows = 30

# One section per dictionary. "path" is the .ifo file. The .idx(.gz) and
# .dict.dz files must be in the same folder with the same base name.
# The file name "eng-deu" gives the label "en→de" and reads the German senses.
#[dictionary/English - German]
#path = %APPDATA%\GoldenDict\content\freedict\eng-deu\eng-deu.ifo
