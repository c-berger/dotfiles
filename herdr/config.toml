onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "symbols"
redraw_on_focus_gained = false
pane_scrollbars = false
# "auto" (default) draws Herdr's own fixed-shape cursor on native Windows to
# avoid ConPTY flicker, which silently swallows the DECSCUSR shape changes
# Neovim sends on InsertEnter/InsertLeave - the insert-mode bar never shows.
# "native" forwards the real terminal cursor instead, so app-requested shapes
# (like Neovim's) render correctly; trade-off is occasional cursor flicker.
host_cursor = "native"

[update]
version_check = false
manifest_check = false

[terminal]
default_shell = "C:\\Users\\chberger\\.dotfiles\\cmder\\cmder-shell.cmd"

[keys]
# BUG: prefix+h conflicts with horizontal split command
focus_pane_left = "prefix+h"  # "ctrl+h is handled via the 'herdr_navigation.ahk' script on Windows
focus_pane_down = "prefix+j"  # "ctrl+j is handled via the 'herdr_navigation.ahk' script on Windows
focus_pane_up = "prefix+k"    # "ctrl+k is handled via the 'herdr_navigation.ahk' script on Windows
focus_pane_right = "prefix+l" # "ctrl+l is handled via the 'herdr_navigation.ahk' script on Windows

# Note that the following keybindings (ctrl+shift+... version) are not working natively on Winodws Terminal!
# Thus, they are also handled via the herdr CLI in the `herdr_navigation.ahk` script on Windows.
resize_pane_left = ["ctrl+shift+h", "prefix+shift+h"]
resize_pane_down = ["ctrl+shift+j", "prefix+shift+j"]
resize_pane_up = ["ctrl+shift+k", "prefix+shift+k"]
resize_pane_right = ["ctrl+shift+l", "prefix+shift+l"]

split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+shift+v", "ctrl+alt+shift+d"]

previous_tab = ["alt+h", "prefix+p"]
next_tab = ["alt+l", "prefix+n"]

move_tab_previous = ["prefix+alt+h"]
move_tab_next = ["prefix+alt+l"]

previous_workspace = "alt+k"
next_workspace = "alt+j"

