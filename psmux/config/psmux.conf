set -g default-terminal "screen-256color"
# set-option -sa terminal-features ',xterm-256color:RGB'

# Use Cmder as default shell
set -g default-shell "cmd.exe /k %ConEmuDir%\..\init.bat /nix_tools 0"
# set -g default-shell "pwsh"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Disable delay for escape (required for VIM)
# NOTE: do not use 0 ms as it has a bug: https://github.com/microsoft/WSL/issues/5931
set -sg escape-time 1

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase psmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Emacs key bindings in psmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# focus-events off: the psmux-vim-navigator poller connects every 250ms as a
# background client. With focus-events on, each connect/disconnect sends FOCO/FOCU
# sequences to neovim, causing cursor flicker. Neovim's own focus detection
# (FocusGained/FocusLost autocmds) is driven by the terminal emulator, not this.
set -g focus-events off

# Start windows and panes index at 1, not 0.
set -g base-index 1
# Start pane numbering at 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# aggressive-resize off: external psmux commands (e.g. ppm poller) connect with
# a default console size and would otherwise shrink all windows to match.
setw -g aggressive-resize off

# Configure VIM mode
set-window-option -g mode-keys vi

# ################################################################################
# Key Bindings
# ################################################################################

# Reload Config File (Prefix + r)
# (change file location to psmux.conf in use)
unbind r
bind r source-file "~/.config/psmux/psmux.conf" \; display-message 'Config reloaded!'

# Open New Windows with Current Path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Switch Windows using Alt-hl
bind -n M-h previous-window
bind -n M-l next-window
# bind -n M-Left previous-window
# bind -n M-Right next-window

# Switch Panes using Alt-Arrow
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Ctrl-hjkl pane navigation is managed dynamically by psmux-vim-navigator.
# Static bindings here would conflict with the plugin's per-keystroke rebinding.

# Resize Panes using Alt-Shift-hjkl
bind -n M-S-h resize-pane -L 5
bind -n M-S-j resize-pane -D 5
bind -n M-S-k resize-pane -U 5
bind -n M-S-l resize-pane -R 5

# Maximize Current Pane (Prefix + m)
bind -r m resize-pane -Z

# Enter Copy Mode (Prefix + ESC)
bind -r Escape copy-mode

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd2Pane


# ################################################################################
# Plugins
# ################################################################################
# Psmux Plugin Manager (tpm)
set -g @plugin 'psmux-plugins/ppm'

# Psmux Navigator
# Navigating Panes Ctrl-hjkl
set -g @plugin 'psmux-plugins/psmux-vim-navigator'
# set -g @vim_navigator_mapping_left   'C-h'
# set -g @vim_navigator_mapping_down   'C-j'
# set -g @vim_navigator_mapping_up     'C-k'
# set -g @vim_navigator_mapping_right  'C-l'
# set -g @vim_navigator_mapping_prev   'C-\\'
# set -g @vim_navigator_prefix_mapping_clear_screen 'C-l'
# set -g @vim_navigator_pattern '(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$'
# set -g @vim_navigator_poll_interval_ms '250'

# Psmux Resurrect
# Persist Sessions
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @resurrect-capture-pane-contents 'on' # allow psmux-ressurect to capture pane contents
# set -g @resurrect-strategy-vim 'session' # capture vim session in Session.vim file.
# set -g @resurrect-strategy-nvim 'session' # capture neovim session in Session.vim file.
set -g @resurrect-processes 'lazygit yazi'
# set -g @resurrect-save-before-hook 'psmux send-keys -t ! ":mksession! ~/session.vim" Enter'

# Psmux Continuum
# Automatically Saves Sessions
set -g @plugin 'psmux-plugins/psmux-continuum'
set -g @continuum-restore 'on'

# Catppuccin Theme
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato, or mocha
# run '~/.config/psmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g @plugin 'psmux-plugins/psmux-theme-catppuccin' # Colortheme
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_text " #W"
run-shell "pwsh -NoProfile -File '~/.psmux/plugins/psmux-theme-catppuccin/psmux-theme-catppuccin.ps1'"

# ################################################################################
# Status Line
# ################################################################################
set -g status-right-length 100
set -g status-left-length 100
set -gF status-left "#{@catppuccin_status_session} "
set -gF  status-right "#{@catppuccin_status_directory}"
# set -agF status-right "#{@catppuccin_status_user}"
# set -agF status-right "#{@catppuccin_status_host}"
# set -agF status-right "#{E:@catppuccin_status_date_time}"

# ################################################################################
# Initialize PSMUX plugin manager (keep this line at the very bottom of psmux.conf)
# ################################################################################
run "pwsh -NoProfile -File '%USERPROFILE%/.psmux/plugins/ppm/ppm.ps1'"
